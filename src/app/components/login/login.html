<div class="login">
    <div class="login__title">
        <h2>Bienvenido de nuevo</h2>
        <span>Accede a tu panel de control.</span>
    </div>
    <form class="login__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="login__form-group">
            <mt-input label="Correo electrónico" type="email" placeholder="ejemplo@correo.com"
                icon="assets/icons/email-icon.svg" formControlName="email" />
        </div>
        <div class="login__form-group">
            <mt-input label="Contraseña" type="password" placeholder="Ingresa tu contraseña"
                icon="assets/icons/lock-icon.svg" formControlName="password" />
            <div class="login__form-group-title"><a routerLink="/auth/recuperar">¿Olvidaste tu contraseña?</a></div>
        </div>

        <mt-button class="login__submit" type="submit" size="lg" [loading]="isLoading()">
            {{ isLoading() ? 'Ingresando...' : 'Ingresar al Sistema' }}
        </mt-button>

        @if (error(); as msg) {
            <div class="form-message">
                <div class="message error-message">
                    <span class="message-icon">⚠</span>
                    <div class="message-text">
                        <strong>Algo ha salido mal</strong>
                        <p>{{ msg }}</p>
                    </div>
                </div>
            </div>
        }
    </form>

    <div class="login__divider">
        <div class="login__divider-line"></div>
        <span>O continuar con</span>
        <div class="login__divider-line"></div>
    </div>
    <div class="login__ways">
        <button type="button" (click)="google()"><img src="assets/icons/google-icon.svg" alt="" /> Google</button>
    </div>
</div>
