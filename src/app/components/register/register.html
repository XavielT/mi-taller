<div class="register">
    <div class="register__title">
        <h2>Crea tu cuenta</h2>
        <span>Únete a la red de talleres más eficientes.</span>
    </div>

    <form class="register__form" [formGroup]="form" (ngSubmit)="onSubmit()" novalidate>
        <div class="register__form-group">
            <mt-input label="Nombre completo" placeholder="Ej: Juan Pérez"
                icon="assets/icons/person-icon.svg" formControlName="name" />
        </div>
        <div class="register__form-group">
            <mt-input label="Nombre del taller" placeholder="Ej: X AutoHub"
                icon="assets/icons/company-icon.svg" formControlName="company" />
        </div>
        <div class="register__form-group">
            <mt-input label="Correo electrónico" type="email" placeholder="ejemplo@correo.com"
                icon="assets/icons/email-icon.svg" formControlName="email" />
        </div>
        <div class="register__form-group">
            <mt-input label="Contraseña" type="password" placeholder="Ingresa tu contraseña"
                icon="assets/icons/lock-icon.svg" formControlName="password" />
        </div>

        <mt-button class="register__submit" type="submit" size="lg" [loading]="isLoading()">
            {{ isLoading() ? 'Creando la cuenta...' : 'Crear Cuenta' }}
        </mt-button>

        @if (error(); as msg) {
            <div class="form-message">
                <div class="message error-message">
                    <span class="message-icon">⚠</span>
                    <div class="message-text">
                        <strong>Algo ha salido mal</strong>
                        <p>{{ msg }}</p>
                    </div>
                </div>
            </div>
        }
        @if (success()) {
            <div class="form-message">
                <div class="message success-message">
                    <span class="message-icon">✓</span>
                    <div class="message-text">
                        <strong>¡Cuenta creada!</strong>
                        <p>Revisa tu correo para confirmar la cuenta y luego inicia sesión.</p>
                    </div>
                </div>
            </div>
        }
    </form>

    <div class="register__divider">
        <div class="register__divider-line"></div>
        <span>O continuar con</span>
        <div class="register__divider-line"></div>
    </div>
    <div class="register__ways">
        <button type="button" (click)="google()"><img src="assets/icons/google-icon.svg" alt="" /> Google</button>
    </div>
</div>
